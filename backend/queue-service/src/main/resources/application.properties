spring.application.name=queue-service
server.port=8081

# --- database (overridden by SPRING_DATASOURCE_* in docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tiko
spring.datasource.username=tiko
spring.datasource.password=tiko
# MVP: let Hibernate create the schema; switch to Flyway before anything real
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
